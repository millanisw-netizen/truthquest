<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>TruthQuest — Evidence Room</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔍</text></svg>"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/platform.css"/>
  <script src="js/platform.js"></script><script src="js/nav.js"></script>
  <style>
    .ev-card{background:var(--glass);border:1px solid var(--border);border-radius:var(--radius-md);
      padding:16px 18px;display:flex;align-items:flex-start;gap:14px;
      transition:border-color var(--r),transform var(--r);animation:fadeIn .35s ease both}
    .ev-card:hover{border-color:rgba(0,212,255,.35);transform:translateY(-2px)}
    [data-theme="light"] .ev-card{background:#fff;border-color:rgba(0,102,204,.1)}
    .ev-icon{font-size:1.6rem;flex-shrink:0;margin-top:2px}
    .ev-body{flex:1;min-width:0}
    .ev-type{font-family:'Orbitron',monospace;font-size:.58rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--blue);margin-bottom:4px}
    .ev-claim{font-size:.82rem;line-height:1.5;margin-bottom:4px;color:var(--white);word-break:break-word}
    [data-theme="light"] .ev-claim{color:#0a0e27}
    .ev-meta{font-size:.68rem;color:var(--text-muted)}
    .ev-verdict{font-size:.65rem;font-weight:700;padding:2px 8px;border-radius:100px;flex-shrink:0;align-self:flex-start;margin-top:2px}
    .ev-correct{background:rgba(0,255,136,.12);color:var(--green);border:1px solid rgba(0,255,136,.25)}
    .ev-wrong{background:rgba(255,68,68,.12);color:var(--red);border:1px solid rgba(255,68,68,.25)}
    .ev-neutral{background:rgba(255,215,0,.1);color:var(--gold);border:1px solid rgba(255,215,0,.2)}
    .ev-delete{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:.9rem;
      padding:4px 6px;border-radius:4px;transition:color var(--r),background var(--r);flex-shrink:0}
    .ev-delete:hover{color:var(--red);background:rgba(255,68,68,.1)}
    .filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
    .filter-chip{background:var(--glass);border:1px solid var(--border);border-radius:100px;
      padding:5px 12px;font-size:.72rem;cursor:pointer;color:var(--text-muted);
      font-family:'Inter',sans-serif;transition:all var(--r)}
    .filter-chip.active,.filter-chip:hover{background:rgba(0,212,255,.1);border-color:var(--blue);color:var(--white)}
    .empty-state{text-align:center;padding:60px 24px;color:var(--text-muted)}
    .empty-icon{font-size:3rem;display:block;margin-bottom:12px}
  </style>
</head>
<body>
  <div class="dept-hero">
    <div class="dept-badge">🗂️ EVIDENCE ROOM</div>
    <h1 class="dept-title">Evidence Room</h1>
    <p class="dept-sub">All evidence collected across your investigations, fact-checks, and game sessions — organised in one place.</p>
  </div>
  <div class="dept-content">

    <div class="grid-4" style="margin-bottom:24px">
      <div class="stat-box"><div class="stat-num" id="ev-total">0</div><div class="stat-lbl">Items</div></div>
      <div class="stat-box"><div class="stat-num" id="ev-correct">0</div><div class="stat-lbl">Correct Calls</div></div>
      <div class="stat-box"><div class="stat-num" id="ev-wrong">0</div><div class="stat-lbl">Wrong Calls</div></div>
      <div class="stat-box"><div class="stat-num" id="ev-types">0</div><div class="stat-lbl">Types</div></div>
    </div>

    <!-- Search & Filter -->
    <div style="display:flex;gap:10px;margin-bottom:16px">
      <input type="text" id="ev-search" class="tq-input" placeholder="Search evidence…" aria-label="Search evidence"/>
      <button class="btn btn-danger" id="ev-clear-all" style="white-space:nowrap;font-size:.72rem;padding:8px 14px">🗑️ Clear All</button>
    </div>
    <div class="filter-bar" id="ev-filter" role="group" aria-label="Filter evidence by type">
      <button class="filter-chip active" data-f="all">All</button>
      <button class="filter-chip" data-f="investigation">🔍 Investigation</button>
      <button class="filter-chip" data-f="submitted">📤 Submitted</button>
      <button class="filter-chip" data-f="game">🎮 Game</button>
      <button class="filter-chip" data-f="social">📱 Social</button>
      <button class="filter-chip" data-f="source">📚 Source</button>
    </div>

    <div id="ev-list"></div>
  </div>

  <script>
  const TYPE_ICONS = {
    investigation:'🔍',submitted:'📤',game:'🎮',social:'📱',
    source:'📚',fact:'📋',ai:'🤖',default:'📁'
  };

  function fmt(ts){ return ts ? new Date(ts).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}) : 'Unknown date'; }

  function render(filter='all', search=''){
    const s   = TQ.load();
    const evs = s.evidenceCollected || [];
    const list= document.getElementById('ev-list');

    // Stats
    document.getElementById('ev-total').textContent   = evs.length;
    document.getElementById('ev-correct').textContent = evs.filter(e=>e.correct===true).length;
    document.getElementById('ev-wrong').textContent   = evs.filter(e=>e.correct===false).length;
    document.getElementById('ev-types').textContent   = [...new Set(evs.map(e=>e.type))].length;

    let filtered = evs.filter(e=>{
      const matchF = filter==='all' || e.type===filter;
      const matchS = !search || JSON.stringify(e).toLowerCase().includes(search.toLowerCase());
      return matchF && matchS;
    });

    if(filtered.length===0){
      list.innerHTML=`<div class="empty-state"><span class="empty-icon">🗂️</span><p>${evs.length===0?'No evidence collected yet. Start an investigation!':'No evidence matches your filter.'}</p></div>`;
      return;
    }

    list.innerHTML='';
    filtered.forEach((ev,i)=>{
      const d=document.createElement('div');
      d.className='ev-card';
      d.style.animationDelay=(i*0.04)+'s';
      const icon    = TYPE_ICONS[ev.type]||TYPE_ICONS.default;
      const verdict = ev.correct===true?'<span class="ev-verdict ev-correct">✅ CORRECT</span>':ev.correct===false?'<span class="ev-verdict ev-wrong">❌ WRONG</span>':'<span class="ev-verdict ev-neutral">📋 LOGGED</span>';
      const claim   = ev.claim||ev.label||ev.verdict||ev.platform||'Evidence item';
      const meta    = [ev.platform&&`📱 ${ev.platform}`, ev.type&&`🏷️ ${ev.type}`, fmt(ev.ts)].filter(Boolean).join(' · ');
      d.innerHTML=`
        <div class="ev-icon">${icon}</div>
        <div class="ev-body">
          <div class="ev-type">${ev.type||'evidence'}</div>
          <div class="ev-claim">${claim}</div>
          <div class="ev-meta">${meta}</div>
        </div>
        ${verdict}
        <button class="ev-delete" data-id="${ev.id}" aria-label="Delete this evidence item" title="Delete">🗑️</button>`;
      list.appendChild(d);
    });
  }

  document.addEventListener('DOMContentLoaded',()=>{
    render();
    let currentFilter='all';
    let currentSearch='';

    document.getElementById('ev-filter').addEventListener('click',e=>{
      const chip=e.target.closest('[data-f]');
      if(!chip) return;
      currentFilter=chip.dataset.f;
      document.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      render(currentFilter, currentSearch);
    });

    document.getElementById('ev-search').addEventListener('input',e=>{
      currentSearch=e.target.value;
      render(currentFilter, currentSearch);
    });

    document.getElementById('ev-list').addEventListener('click',e=>{
      const btn=e.target.closest('[data-id]');
      if(!btn) return;
      if(!confirm('Delete this evidence item?')) return;
      const s=TQ.load();
      s.evidenceCollected=(s.evidenceCollected||[]).filter(ev=>ev.id!==btn.dataset.id);
      TQ.save(s);
      render(currentFilter, currentSearch);
    });

    document.getElementById('ev-clear-all').addEventListener('click',()=>{
      if(!confirm('Clear ALL evidence? This cannot be undone.')) return;
      const s=TQ.load(); s.evidenceCollected=[]; TQ.save(s);
      render(currentFilter, currentSearch);
    });

    // Also add game scores as evidence on load
    const s=TQ.load();
    if(s.gameScore>0 && !(s.evidenceCollected||[]).some(e=>e.type==='game')){
      TQ.addEvidence({type:'game',claim:`Game completed — score: ${s.gameScore}/100`,correct:true,badges:s.gameBadges||[]});
      render(currentFilter, currentSearch);
    }
  });
  </script>
</body>
</html>
